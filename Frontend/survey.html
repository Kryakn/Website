<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Survey | VoxIntel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/buttons.css">
    <link rel="stylesheet" href="assets/css/survey.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body class="participation-page">
    <header class="participation-header">
        <a href="index.html" class="participation-logo">Vox<span>Intel</span></a>
        <span class="participation-security">
            <i class="fa-solid fa-lock"></i>
            Secure survey
        </span>
    </header>

    <main class="participation-main">
        <div class="participation-container">
            <div class="participation-progress-area" id="survey-progress" hidden>
                <div class="participation-progress-text">
                    <span>Survey progress</span>
                    <strong id="survey-progress-text">0 of 0</strong>
                </div>
                <div class="participation-progress-track" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="participation-progress-fill"></div>
                </div>
            </div>

            <div class="participation-introduction" id="survey-introduction">
                <span class="participation-category" id="survey-category">Survey</span>
                <h1 id="survey-title">Loading survey...</h1>
                <p id="survey-description">Please wait while VoxIntel loads the questions.</p>
                <div class="participation-meta" id="survey-meta" hidden>
                    <span><i class="fa-regular fa-clock"></i><span id="survey-duration">1 minute</span></span>
                    <span><i class="fa-solid fa-list-check"></i><span id="survey-question-count">0 questions</span></span>
                </div>
            </div>

            <form class="participation-form" id="participation-form" hidden>
                <div id="participation-questions"></div>
                <p class="participation-message" id="participation-message" role="status" aria-live="polite"></p>
                <div class="participation-actions">
                    <p><i class="fa-solid fa-shield-halved"></i>Your answers remain private.</p>
                    <button type="submit" class="participation-submit">
                        Submit Response
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <footer class="participation-footer">
                Powered by <a href="index.html">VoxIntel</a>
            </footer>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/survey.js"></script>
</body>

</html>
